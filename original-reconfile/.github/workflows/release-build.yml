name: Build binaries (Windows + macOS + Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Build (spec)
        run: |
          pyinstaller fileops.spec

      - name: Package + checksum
        run: python .github/scripts/package_release.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReconFile-${{ matrix.os }}
          path: release/*
