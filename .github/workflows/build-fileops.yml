name: Build FileOps Windows macOS Linux
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test unified FileOps
        run: python -m pytest -q tests
      - name: Build FileOps executable
        run: python -m PyInstaller --noconfirm fileops.spec
      - name: Smoke test executable
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./dist/fileops.exe --version
          else
            ./dist/fileops --version
          fi
      - name: Upload OS build
        uses: actions/upload-artifact@v4
        with:
          name: FileOps-${{ runner.os }}-${{ runner.arch }}
          path: dist/fileops*
          if-no-files-found: error
